
# =========================================
# DATABASE CONFIGURATION
# =========================================

spring.datasource.url=jdbc:mysql://localhost:3306/voiceoc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123rahul#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE CONFIGURATION
# =========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================================
# SERVER CONFIGURATION
# =========================================

server.port=8080

# =========================================
# FILE UPLOAD CONFIGURATION
# =========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=/tmp

# =========================================
# LOGGING CONFIGURATION
# =========================================

logging.level.org.springframework.web=DEBUG
logging.level.com.rahul.dailytask=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================================
# STATIC RESOURCES
# =========================================

spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# =========================================
# CORS CONFIGURATION (OPTIONAL)
# =========================================

# spring.web.cors.allowed-origins=*
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true

# =========================================
# GENERAL SCHEDULER CONFIGURATION
# =========================================

monitor.scheduler.enabled=true
monitor.scheduler.fixed-delay=300000

# =========================================
# SSL VERIFICATION (DEVELOPMENT ONLY)
# =========================================

app.ssl.verification.enabled=false

# =========================================
# BUG SHEET STORAGE
# =========================================

file.upload-dir=uploads/bugtracker

# =========================================
# ALLOW BEAN OVERRIDING
# =========================================

spring.main.allow-bean-definition-overriding=true

# ==========================================
# WHATSAPP BOT MONITOR CONFIGURATION
# ==========================================

# Enable WhatsApp monitoring
whatsapp.monitor.enabled=true

# Mark bot as inactive after 15 minutes without activity
whatsapp.monitor.inactive-minutes=15

# ==========================================
# WHATSAPP TOKEN REFRESH CONFIGURATION
# ==========================================

# Enable scheduled authentication checks and token refresh
whatsapp.monitor.token-refresh-enabled=true

# Schedule is configured in WhatsAppBotMonitorService.java
# 12:00 AM, 6:00 AM, 9:00 AM, 10:00 AM,
# 7:00 PM and 10:00 PM (Asia/Kolkata)

# No fixed-delay property is required for the cron schedule

