# =========================================
# DATABASE CONFIGURATION
# =========================================

spring.datasource.url=jdbc:mysql://localhost:3306/voiceoc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123rahul#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE CONFIGURATION
# =========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================================
# SERVER CONFIGURATION
# =========================================

server.port=8080

# =========================================
# FILE UPLOAD CONFIGURATION
# =========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=/tmp

# =========================================
# LOGGING CONFIGURATION
# =========================================

logging.level.org.springframework.web=DEBUG
logging.level.com.rahul.dailytask=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================================
# STATIC RESOURCES
# =========================================

spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# =========================================
# CORS CONFIGURATION (Optional)
# =========================================

# spring.web.cors.allowed-origins=*
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true

# =========================================
# SCHEDULER CONFIGURATION
# =========================================

# Enable/disable scheduler
monitor.scheduler.enabled=true

# Check interval in milliseconds (5 minutes = 300000)
monitor.scheduler.fixed-delay=300000

# =========================================
# SSL VERIFICATION (Development Only)
# =========================================
app.ssl.verification.enabled=false

# =========================================
# BUG SHEET STORAGE
# =========================================

file.upload-dir=uploads/bugtracker

# =========================================
# ALLOW BEAN OVERRIDING (Fix for duplicate bean error)
# =========================================

spring.main.allow-bean-definition-overriding=true

# ==========================================
# WHATSAPP BOT MONITOR
